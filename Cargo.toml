[package]
name = "azur-file-explorer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A file explorer that stays out of the way: tabs in the title bar, a real breadcrumb, and side-by-side panes"
build = "build.rs"
publish = false

[dependencies]
# Must resolve to the same egui the theme tracks: two egui versions in one graph
# are two different `Context` types, and the theme would style neither.
egui = { version = "0.35", default-features = false }
azur-egui-theme = { path = "../azur-egui-theme" }

# To ask eframe for the window's `HWND`, which the shell needs so its progress and
# conflict dialogs are owned by this window instead of appearing behind it. Pinned to
# the version eframe itself resolves, or the handle would be a different type.
raw-window-handle = "0.6.2"

# To decode the design system's icon into the bitmap the window hands the taskbar, to write
# `--shot` frames, and to decode whatever the preview panel is pointed at. Already in the graph
# via eframe.
#
# The codec list is the preview panel's, and it is every raster format `image` implements in
# pure Rust — no C library appears here, which is the whole reason this crate and not one of
# the bindings. `avif` and `exr` are left out: the first needs `dav1d`, and the second is a
# 16-bit-float format whose tone mapping is a decision a file manager has no business making.
# Vector art is `resvg`'s, below.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "webp",
    "pnm",
    "tga",
    "dds",
    "hdr",
    "qoi",
    "ff",
] }

# SVG, for the preview panel, because a folder of icons is a folder of `.svg` and a preview
# that cannot show them is not much of a preview.
#
# `default-features = false` deliberately, and it is the difference between eleven small crates
# and a font stack: the default build pulls `fontdb`, `rustybuzz` and system font enumeration in
# order to lay out `<text>` elements, which is most of the dependency and none of the value here.
# The cost is that text inside an SVG is not drawn — see `preview::vector`, which says so on the
# canvas rather than quietly leaving a hole.
resvg = { version = "0.48", default-features = false }

# The regex toggle in the text preview's find bar, and nothing else. A find bar without one is a
# find bar people work around, and the alternative was writing an engine: a wrong regex engine in a
# file manager is worse than a dependency, and this is the crate whose correctness is not in doubt.
#
# It is also the *only* engine safe to hand a pattern somebody is still typing. `regex` has no
# backtracking by construction, so it cannot be made to hang by `(a+)+b` — which a find bar running
# on the UI thread on every keystroke would otherwise be one paste away from. `size_limit` in
# `preview::hits` covers the other end, where a pattern is legal but compiles to something enormous.
#
# `default-features = false` drops the whole `perf` group — `aho-corasick`, `memchr`, the lazy DFA
# and the one-pass and backtracking engines — leaving the PikeVM, which is slower per byte and a
# fraction of the code. Which is the right trade here and only here: the haystack is one text
# preview, capped at `preview::TEXT_CAP` (1 MiB), where the plain (non-regex) search does not use
# this crate at all.
#
# `unicode-case` is what makes the match-case toggle mean anything outside ASCII, and `unicode-perl`
# is `\d`, `\w` and `\s` — the three escapes anybody typing a pattern will reach for first.
#
# Both stay, and that was measured rather than assumed. They are 179,612 bytes of Unicode tables in
# `regex-syntax` alone and 249,856 of this executable, which is the largest single saving left in
# the binary — and there is no way to take it that a find bar survives. Dropping them and asking
# the engine for ASCII semantics with `.unicode(false)` makes `.` match a byte instead of a
# character, so `regex` refuses to compile any pattern containing one rather than risk slicing a
# string mid-sequence: `preview::tests::a_regex_is_a_pattern_and_a_literal_is_not` catches it.
# Dropping them and leaving Unicode mode on only moves the breakage to `\d`, `\w`, `\s` and `\b`,
# which stop compiling — and the whole-word toggle wraps every pattern in `\b`. See
# `preview::search`, which documents the same conclusion from the other side.
regex = { version = "1", default-features = false, features = [
    "std",
    "unicode-case",
    "unicode-perl",
] }

# `wgpu`, and only `wgpu` — `main::reporting_wgpu` has the measurements. In short: `egui_glow`'s
# painter leaks a couple of kilobytes per draw call per frame, which scrolling turns into 7 MB a
# second, and `wgpu` does not. `glow` used to be compiled in beside it so `AZUR_GLOW=1` could go
# back on a machine where this one misbehaves; it is gone, because keeping a second renderer for a
# machine nobody has seen cost 181,476 bytes and the escape hatch that matters — a different
# *backend* — is `AZUR_BACKEND=d3d12`, which stays. Which backend `wgpu` presents on is
# `azur_egui_theme::render`'s decision, not this crate's: the compositor resamples OpenGL and
# D3D12 windows, and a design system specified in one-pixel strokes does not survive that.
#
# **`wgpu_no_default_features`, not `wgpu`.** They sound like opposites and are not: this is the
# feature that brings in `dep:wgpu`, `dep:egui-wgpu` and `dep:pollster` *without* also enabling
# `egui-wgpu/default`, which is what eframe's own `wgpu` feature does — and `egui-wgpu/default`
# contains `wgpu/default`, which is every backend wgpu has. Taking eframe's `wgpu` feature here
# would silently re-enable all of them and undo the feature set `azur-egui-theme` pins, which is
# where the backend decision belongs. Measured: 531,456 bytes of this executable.
#
# `default_fonts` is gone too. It embedded four TrueType files — NotoEmoji, Ubuntu-Light,
# emoji-icon-font and Hack, 1,414,020 bytes, the largest data objects in the binary — as the
# fallback behind whatever `azur_egui_theme::fonts` loads from the system. This program is
# Windows-only in practice and Segoe UI and Consolas are always there, so the fallback was paying
# 7% of the executable to cover a font read that does not fail. What it also covered was emoji,
# which Segoe UI does not carry: a filename with one in it now draws a missing-glyph box.
eframe = { version = "0.35", default-features = false, features = [
    "wgpu_no_default_features",
    "x11",
    "wayland",
] }

[target.'cfg(windows)'.dependencies]
# COM, for the parts of this program that are the shell rather than merely near it:
# the system image list behind Explorer's file icons, `IFileOperation` behind its
# copy/move/delete (with its progress, its conflict prompts and its undo), the real
# `IContextMenu` including whatever extensions are installed, and OLE drag and drop.
#
# None of that is expressible through `windows-sys`, which is flat `extern` blocks
# with no vtable dispatch. Both crates are kept rather than one: the flat calls in
# `fs/` are written, tested and fast against `windows-sys`, and rewriting them to
# change nothing would be churn in the one place that must not regress.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # `GetOEMCP`, `IsDBCSLeadByteEx` and `MultiByteToWideChar` — the *other* encoding on a console
    # pipe. The shell writes UTF-8; `net`, `ipconfig` and every other Win32 console tool write the
    # OEM code page, and redirecting the handle to a pipe does not change that. Decoding it is what
    # keeps `net use` on a French machine from arriving as `m?moris?es` — and, before that, from
    # wedging the pipe's decoder for the rest of the session. See `console::Decoder`.
    "Win32_Globalization",
    # The three that carry one texture. The preview panel plays video by asking Media Foundation's
    # Media Engine for the frame that is on screen, which it writes into a D3D11 texture — so a
    # device, a texture and a DXGI format have to be nameable. `Direct3D` is here for one enum
    # (`D3D_DRIVER_TYPE_HARDWARE`) and `Dxgi_Common` for one constant
    # (`DXGI_FORMAT_B8G8R8A8_UNORM`); neither is a dependency in any other sense.
    #
    # No swap chain, no renderer, no second compositor in the window: the texture is copied back to
    # memory and handed to egui as an ordinary image. `windows::video`'s header has the reasoning,
    # including what asking for a window instead would have cost.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # `DwmSetWindowAttribute`, for one attribute: the cloak that keeps the compositor from
    # showing this window before anything has been drawn into it. See `main::cloak`.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # The whole player: `IMFMediaEngine` in frame-server mode, which resolves the file, picks the
    # hardware decoder, opens the audio device, keeps picture and sound together and answers a seek.
    # Every one of those is a thing this program would otherwise be writing — and the audio one is
    # not writable at all without an output device — which is why the alternative here was never
    # `ffmpeg` but "no player". See `preview::video`.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # `GetProcessMemoryInfo` and `GetGuiResources`, for the leak test in `app::click_tests`:
    # the Rust heap is only part of this process, and the shell, COM and GDI all allocate
    # outside it — as do the icon and bitmap handles this program asks the shell for.
    "Win32_System_ProcessStatus",
    # `CreateJobObjectW` and `TerminateJobObject`, for stopping a command in the console panel.
    # A job object is the only reliable way to end a process *tree* from a program with no console:
    # `GenerateConsoleCtrlEvent` signals a console process group, and a `windows` subsystem binary
    # has no console to have a group in. See `console::Session::stop`.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    # `DRIVE_REMOTE`, which is where the constants `GetDriveTypeW` returns happen to
    # live. See `shell::over_network`.
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    # `SECURITY_ATTRIBUTES`, which is the last parameter of `CreateFileW`, `CreateEventW` and
    # `CreateJobObjectW` — so without this feature those three are `configured out` and
    # `windows/watch.rs`, `windows/com.rs` and `windows/job.rs` do not compile.
    #
    # It belonged here from the start and was missing: it arrived through `wgpu-hal`, whose D3D12
    # backend wanted it, and this crate compiled on the strength of a feature a *graphics* backend
    # happened to enable on the shared `windows` crate. Dropping D3D12 for its 407,396 bytes is
    # what surfaced that — feature unification makes this class of accident silent until the crate
    # that was carrying you leaves.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# The whole reason the listing is fast. `FindFirstFileExW` at `FindExInfoBasic` hands
# the UTF-16 name straight into the arena, and `LARGE_FETCH` fills a big buffer per
# syscall instead of a small one.
# The `#[implement]` macro expands to `::windows_core::…` paths, so the crate has to be
# nameable here even though everything else reaches it through `windows::core`. Needed
# for the two OLE interfaces this program implements rather than merely calls:
# `IDropSource` and `IDropTarget`.
windows-core = "0.62"

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # `NetApiBufferFree`, which frees what `NetShareEnum` allocates. The enumeration itself is
    # filed under `Win32_Storage_FileSystem` above, along with its `SHARE_INFO_1` — this feature
    # is here for the one call that gives the buffer back. See `fs::drives::shares_on`.
    "Win32_NetworkManagement_NetManagement",
    # `WNetOpenEnumW`, for the one thing `GetLogicalDrives` cannot answer: a connection to
    # `\\server\share` that was made without mapping a drive letter is not a bit in a 26-bit
    # mask, and every UNC path this machine has open is one of those. See
    # `fs::drives::list_shares` — three functions out of `mpr.dll`, no COM, and it reads the
    # redirector's own connection table rather than going to the network.
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    # `RegOpenKeyExW` and `RegQueryValueExW`, for one question asked of `HKEY_CLASSES_ROOT`: does
    # this machine have a thumbnail provider registered for this file type. Four key reads and no
    # COM, which is what makes it answerable on the UI thread — see `shell::providers`, and note
    # that the alternative (`GetImage` on a real file) costs 12–22 ms and runs a stranger's DLL.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
# `fat`, not `thin`, and the difference is 1,163,264 bytes of executable — measured on this crate,
# not quoted from anywhere. It costs build time and only build time: 3m37s against 1m25s from cold.
# A release build is not what anybody waits on here — `cargo claude-*` and `cargo build` are, and
# both are still `dev` — so the trade is a slower `cargo deploy` for an executable an eighth
# smaller.
lto = "fat"
codegen-units = 1
strip = true

# **`z` for the code that runs once.** `opt-level = 3` is what makes a listing of 100k entries
# feel like a listing, and every crate below is one that speed cannot reach: a shader is
# translated once at pipeline creation, a pattern is compiled once per keystroke of a find, an SVG
# is parsed once per preview. None of them is on the frame path, and optimising them for speed
# buys nothing anybody can perceive.
#
# Worth 1,098,240 bytes together, which is within 65,024 of what `lto = "fat"` is worth and costs
# 30 seconds of build time rather than two minutes. The two are very nearly additive: 2,205,696
# together, 12.3% of the executable this landed on.
#
# `naga` is the whole prize — 2,057,000 bytes of WGSL parser, SPIR-V writer and IR validator that
# run while the window is still cloaked. `tiny-skia` and `resvg` are deliberately *not* here: they
# rasterise, which is real per-pixel work, and `image`'s codecs are not here for the same reason.
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.regex-syntax]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.usvg]
opt-level = "z"
[profile.release.package.roxmltree]
opt-level = "z"
[profile.release.package.simplecss]
opt-level = "z"
[profile.release.package.svgtypes]
opt-level = "z"

# A file explorer is only worth using at speed, and an unoptimised `sort_by` over
# 100k entries is visible. Optimise the dependencies even in a debug build.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
# Puts the `.ico` into the executable's own resources, which is the only way Explorer, a
# pinned shortcut or Alt-Tab-before-launch can show it — none of them run the process.
# A build-time dependency only; nothing of it is linked into the program.
winresource = "0.1"
